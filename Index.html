<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hana Portfolio</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#070b1a;
  color:white;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:#111827;
  position:sticky;
  top:0;
}

.logo{
  color:#ff4fd8;
  font-size:24px;
  font-weight:bold;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
}

img{
  width:200px;
  height:200px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #ff4fd8;
  margin-top:20px;
  transition:0.3s;
}

img:hover{
  transform:scale(1.1);
}

/* BUTTON */
.btn{
  display:inline-block;
  margin-top:20px;
  padding:10px 20px;
  background:#ff4fd8;
  color:black;
  border-radius:10px;
  text-decoration:none;
}

/* SECTIONS */
section{
  padding:50px 20px;
  text-align:center;
}

.card{
  background:#111827;
  padding:15px;
  margin:10px;
  display:inline-block;
  border-radius:10px;
  width:120px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
  border:1px solid #ff4fd8;
}

/* CONTACT */
input,textarea{
  width:80%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}

button{
  padding:10px 20px;
  background:#ff4fd8;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* ANIMATION */
.fade{
  animation:fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* MOBILE */
@media(max-width:600px){
  .card{
    width:80%;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">HANA</div>
</nav>

<!-- HERO -->
<div class="hero fade">
  <h1>Hi, I'm Hana</h1>

  <!-- IMAGE -->
  <img src="hana.jpg" alt="Hana">

  <p>IT Student | Web Developer | Designer</p>

  <a class="btn" href="#projects">View Projects</a>
</div>

<!-- SKILLS -->
<section class="fade">
<h2>Skills</h2>
<div class="card">HTML</div>
<div class="card">CSS</div>
<div class="card">JS</div>
<div class="card">Python</div>
</section>

<!-- PROJECTS -->
<section id="projects" class="fade">
<h2>Projects</h2>
<div class="card">Portfolio</div>
<div class="card">Task App</div>
<div class="card">UI Design</div>
</section>

<!-- CONTACT -->
<section class="fade">
<h2>Contact Me</h2>

<input type="text" placeholder="Your Name"><br>
<input type="email" placeholder="Your Email"><br>
<textarea placeholder="Message"></textarea><br>

<button onclick="alert('Message Sent!')">Send</button>
</section>

</body>
  </html>
